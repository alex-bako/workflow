<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Tools</title>
<style>
body { margin: 0; color: #18202c; background: white; font-family: Georgia, serif; }
main { width: 720px; margin: 48px auto; padding: 0 24px; }
label, input { display: block; margin: 12px 0; }
input, button { font: inherit; padding: 12px; }
button { color: white; background: #1458cc; border: 0; border-radius: 6px; }
</style>
<main>
  <h1>Small Tools</h1>
  <p>Useful tools for everyday work.</p>
  <section id="signup">
    <h2>Join the waitlist</h2>
    <form>
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <button>Join waitlist</button>
      <p id="status" role="status"></p>
    </form>
  </section>
</main>
<script>
document.querySelector('form').addEventListener('submit', event => event.preventDefault());
</script>
</html>
