schema_version = "1.3"
# Step 1 writes the packet; step 2, a fresh reviewer, works from it. The router
# must pass for the reviewer to run, and the trial scores the last step run, so
# 1.0 means both passed (all-pass across the pair).
multi_step_reward_strategy = "final"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[[steps]]
name = "packet"
min_reward = 1.0
artifacts = ["/app/review-packet.md"]

[steps.agent]
timeout_sec = 900.0

[[steps]]
name = "review"
artifacts = ["/app/review-report.md", "/app/review-report.json",
             "/var/log/git-calls.log", "/var/log/gh-calls.log"]
